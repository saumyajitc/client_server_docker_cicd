services:
  server:
    build: ./server
    container_name: express-server
    networks:
      - fullstack-net
    restart: unless-stopped
  client:
    build: ./client
    container_name: react-client
    networks:
      - fullstack-net
    depends_on:
      - server
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - fullstack-net
    depends_on:
      - client
      - server
    restart: unless-stopped

networks:
  fullstack-net:
    driver: bridge
